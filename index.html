// ═══════════════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════════════
const CX = 1100, CY = 1050;

// Danantara far top-right, clear of all others
const L1_CFG = {
  danantara:  { angle: -58, dist: 420 },  // far top-right, clear of Aksi Alika
  astagina:   { angle:  22, dist: 350 },
  bau:        { angle: 158, dist: 335 },
  alika:      { angle: 270, dist: 330 },  // straight up
  stakeholder:{ angle: 205, dist: 315 }
};

function rad(d){ return d * Math.PI / 180; }

TREE.x = CX; TREE.y = CY;
TREE.children.forEach(c => {
  const cfg = L1_CFG[c.id];
  c.x = CX + Math.cos(rad(cfg.angle)) * cfg.dist;
  c.y = CY + Math.sin(rad(cfg.angle)) * cfg.dist;
});

function placeL2(parent) {
  const ch = parent.children;
  if (!ch || !ch.length) return;
  const baseAngle = Math.atan2(parent.y - CY, parent.x - CX) * 180 / Math.PI;
  const spread = Math.min(148, 28 * ch.length);
  const step = spread / Math.max(ch.length - 1, 1);
  const dist = parent.r + 55 + (ch.length > 5 ? 148 : 128);
  ch.forEach((c, i) => {
    const a = rad(ch.length === 1 ? baseAngle : baseAngle - spread/2 + i * step);
    c.x = parent.x + Math.cos(a) * dist;
    c.y = parent.y + Math.sin(a) * dist;
  });
}
TREE.children.forEach(c => { if(c.children) placeL2(c); });

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
const nodesLayer = document.getElementById('nodes-layer');
const edgesLayer = document.getElementById('edges-layer');
const expanded = new Set();
const edgeReg = {};
const nodeReg = {};

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  return el;
}

function buildNode(d) {
  const g = svgEl('g', { class:'bubble', 'data-id': d.id });

  g.appendChild(svgEl('circle', {
    cx: d.x, cy: d.y, r: d.r,
    fill: d.fill, stroke: d.stroke || '#bbb',
    'stroke-width': d.strokeW || 1.5,
    'stroke-dasharray': d.dashed ? '6 4' : 'none'
  }));

  // Label only — no sub-label in bubble
  const lines = d.label.split('\n');
  const isXL  = d.r >= 75;
  const isLG  = d.r >= 55;
  const isMD  = d.r >= 42;
  const fsize = isXL ? 20 : isLG ? 16 : isMD ? 13 : 11;
  const fw    = isXL ? '800' : isLG ? '700' : '600';
  const lh    = fsize + 5;
  const totalH = lines.length * lh;
  const startY = d.y - totalH / 2 + lh / 2;

  lines.forEach((line, i) => {
    const t = svgEl('text', {
      x: d.x, y: startY + i * lh,
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      fill: d.textFill || '#1a1a1a',
      'font-size': fsize, 'font-weight': fw,
      'font-family': "'Inter', system-ui, sans-serif"
    });
    t.textContent = line;
    g.appendChild(t);
  });

  // Expand dot — top-right corner
  if (d.children && d.children.length) {
    const px = d.x + d.r * 0.68, py = d.y - d.r * 0.68;
    g.appendChild(svgEl('circle', { cx:px, cy:py, r:8, fill:'rgba(255,255,255,0.92)', class:'expdot' }));
    const plus = svgEl('text', {
      x:px, y:py, 'text-anchor':'middle', 'dominant-baseline':'central',
      fill:'#333', 'font-size':'11', 'font-weight':'800',
      'font-family':"'Inter', system-ui, sans-serif", class:'expdot'
    });
    plus.textContent = '+';
    g.appendChild(plus);
  }

  g.addEventListener('click', e => { e.stopPropagation(); onNodeClick(d); });
  return g;
}

function buildEdge(x1,y1,x2,y2,color,dashed) {
  return svgEl('line', {
    x1,y1,x2,y2, stroke:color,
    'stroke-width':'2', opacity:'0.35',
    'stroke-dasharray': dashed ? '7 5' : 'none'
  });
}

function mountNode(d, animate) {
  const el = buildNode(d);
  nodesLayer.appendChild(el);
  nodeReg[d.id] = { el, data: d };
  if (animate) {
    const c = el.querySelector('circle');
    const fr = d.r;
    c.setAttribute('r','0');
    requestAnimationFrame(() => {
      c.style.transition = 'r .4s cubic-bezier(.34,1.56,.64,1)';
      c.setAttribute('r', fr);
    });
  }
}

function mountEdge(x1,y1,x2,y2,color,dashed,key) {
  const el = buildEdge(x1,y1,x2,y2,color,dashed);
  edgesLayer.appendChild(el);
  edgeReg[key] = el;
}

function onNodeClick(d) {
  showPanel(d);
  if (!d.children || !d.children.length) return;
  if (expanded.has(d.id)) collapseNode(d);
  else expandNode(d);
}

function expandNode(d) {
  expanded.add(d.id);
  d.children.forEach(c => {
    mountEdge(d.x,d.y,c.x,c.y,d.fill,c.dashed,'e-'+c.id);
    mountNode(c,true);
  });
  flipDot(d,true);
}

function collapseNode(d) {
  expanded.delete(d.id);
  d.children.forEach(c => {
    if (c.children && expanded.has(c.id)) collapseNode(c);
    if (edgeReg['e-'+c.id]) { edgeReg['e-'+c.id].remove(); delete edgeReg['e-'+c.id]; }
    if (nodeReg[c.id]) { nodeReg[c.id].el.remove(); delete nodeReg[c.id]; }
  });
  flipDot(d,false);
}

function flipDot(d,open) {
  const nr = nodeReg[d.id]; if(!nr) return;
  const plus = nr.el.querySelector('text.expdot');
  if(plus) plus.textContent = open ? '−' : '+';
}

function initRender() {
  TREE.x = CX; TREE.y = CY;
  mountNode(TREE,false);
  TREE.children.forEach(c => {
    mountEdge(CX,CY,c.x,c.y,c.fill,c.dashed,'l1-'+c.id);
    mountNode(c,false);
  });
}

// ═══════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════
function showPanel(d) {
  if(!d.detail) return;
  const det = d.detail;
  let html = `<span class="p-tag" style="color:${det.tagColor};background:${det.tagBg}">${det.tag}</span>
    <div class="p-title">${det.title}</div>
    <div class="p-sub">${det.sub}</div>`;
  det.sections.forEach(s => {
    html += `<div class="p-sec-label">${s.label}</div>`;
    s.items.forEach(item => { html += `<div class="p-item">${item}</div>`; });
  });
  document.getElementById('panel-body').innerHTML = html;
  document.getElementById('panel').classList.add('open');
}
function closePanel() { document.getElementById('panel').classList.remove('open'); }

// ═══════════════════════════════════════════════════════════
// PAN & ZOOM
// ═══════════════════════════════════════════════════════════
let scale=1,tx=0,ty=0,dragging=false,lx=0,ly=0;
const vp=document.getElementById('viewport');
function applyT(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
function doZoom(f,cx,cy){
  cx=cx??window.innerWidth/2; cy=cy??window.innerHeight/2;
  const ns=Math.max(0.12,Math.min(4,scale*f));
  tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale);
  scale=ns; applyT();
}
function resetView(){
  scale=0.46;
  tx=window.innerWidth/2-CX*scale;
  ty=window.innerHeight/2-CY*scale;
  applyT();
}
const cv=document.getElementById('canvas');
cv.addEventListener('mousedown',e=>{if(e.target.closest('.bubble'))return;dragging=true;lx=e.clientX;ly=e.clientY;cv.classList.add('dragging');});
window.addEventListener('mousemove',e=>{if(!dragging)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;applyT();});
window.addEventListener('mouseup',()=>{dragging=false;cv.classList.remove('dragging');});
cv.addEventListener('wheel',e=>{e.preventDefault();doZoom(e.deltaY<0?1.09:0.91,e.clientX,e.clientY);},{passive:false});
let t0=0;
cv.addEventListener('touchstart',e=>{if(e.touches.length===1){lx=e.touches[0].clientX;ly=e.touches[0].clientY;}if(e.touches.length===2)t0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1){tx+=e.touches[0].clientX-lx;ty+=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;applyT();}if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);doZoom(d/t0,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);t0=d;}},{passive:false});

initRender();
resetView();
</script>
