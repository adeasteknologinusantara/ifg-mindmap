// ═══════════════════════════════════════════════════════════════
// LAYOUT ENGINE
// ═══════════════════════════════════════════════════════════════
const CX = 1100, CY = 900;

const L1_ANGLES = {
  danantara: -88, astagina: 28, bau: 152, alika: 272, stakeholder: 210
};
const L1_DIST = {
  danantara: 220, astagina: 290, bau: 268, alika: 268, stakeholder: 250
};

function toRad(deg) { return deg * Math.PI / 180; }

function placeL1() {
  TREE.children.forEach(c => {
    const a = toRad(L1_ANGLES[c.id]);
    const d = L1_DIST[c.id];
    c.x = CX + Math.cos(a) * d;
    c.y = CY + Math.sin(a) * d;
  });
}

function placeL2(parent, children) {
  if (!children || !children.length) return;
  // angle pointing away from IFG center
  const baseAngle = Math.atan2(parent.y - CY, parent.x - CX) * 180 / Math.PI;
  const spread = Math.min(140, children.length * 32);
  const step = spread / Math.max(children.length - 1, 1);
  const start = baseAngle - spread / 2;
  const dist = parent.r + 60 + (children.length > 5 ? 130 : 115);
  children.forEach((c, i) => {
    const a = toRad(children.length === 1 ? baseAngle : start + i * step);
    c.x = parent.x + Math.cos(a) * dist;
    c.y = parent.y + Math.sin(a) * dist;
  });
}

placeL1();
TREE.children.forEach(c => { if (c.children) placeL2(c, c.children); });

// ═══════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════
const nodesLayer = document.getElementById('nodes-layer');
const edgesLayer = document.getElementById('edges-layer');
const expandedSet = new Set();
const edgeRegistry = {};
const nodeRegistry = {};

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

function buildNode(d) {
  const g = svgEl('g', { class:'bubble', 'data-id': d.id });

  const circ = svgEl('circle', {
    cx: d.x, cy: d.y, r: d.r,
    fill: d.fill,
    stroke: d.stroke || '#fff',
    'stroke-width': d.strokeW || 1.5,
    'stroke-dasharray': d.dashed ? '5 3' : 'none'
  });
  g.appendChild(circ);

  const lines = d.label.split('\n');
  const fsize = d.r >= 52 ? 14 : d.r >= 38 ? 12 : d.r >= 30 ? 10.5 : 9.5;
  const lh = fsize + 3;
  const totalH = lines.length * lh;
  const hasSub = d.sub && d.r >= 34;
  const offsetY = hasSub ? -(lh * 0.4) : 0;

  lines.forEach((line, i) => {
    const t = svgEl('text', {
      x: d.x,
      y: d.y - totalH / 2 + lh / 2 + i * lh + offsetY,
      'text-anchor': 'middle',
      'dominant-baseline': 'central',
      fill: d.textFill || '#fff',
      'font-size': fsize,
      'font-weight': d.r >= 50 ? '700' : '600',
      'font-family': "'Inter', system-ui, sans-serif"
    });
    t.textContent = line;
    g.appendChild(t);
  });

  if (hasSub) {
    const maxLen = Math.floor(d.r * 1.8 / 6);
    let subTxt = d.sub.length > maxLen ? d.sub.slice(0, maxLen - 1) + '…' : d.sub;
    const st = svgEl('text', {
      x: d.x,
      y: d.y + totalH / 2 - lh / 2 + offsetY + lh + 2,
      'text-anchor': 'middle',
      'dominant-baseline': 'central',
      fill: d.textFill || '#fff',
      opacity: '0.6',
      'font-size': Math.max(8, fsize - 2.5),
      'font-family': "'Inter', system-ui, sans-serif"
    });
    st.textContent = subTxt;
    g.appendChild(st);
  }

  if (d.children && d.children.length) {
    const px = d.x + d.r * 0.68, py = d.y - d.r * 0.68;
    const dot = svgEl('circle', { cx: px, cy: py, r: 6, fill: '#fff', opacity: '0.85', class: 'expdot' });
    const plus = svgEl('text', {
      x: px, y: py,
      'text-anchor': 'middle', 'dominant-baseline': 'central',
      fill: d.fill, 'font-size': '9', 'font-weight': '800',
      'font-family': "'Inter', system-ui, sans-serif",
      class: 'expdot'
    });
    plus.textContent = '+';
    g.appendChild(dot);
    g.appendChild(plus);
  }

  g.addEventListener('click', e => { e.stopPropagation(); onNodeClick(d); });
  return g;
}

function buildEdge(x1, y1, x2, y2, color, dashed) {
  return svgEl('line', {
    x1, y1, x2, y2,
    stroke: color, 'stroke-width': '1.8',
    opacity: '0.38',
    'stroke-dasharray': dashed ? '6 4' : 'none'
  });
}

function mountNode(d, animate) {
  const el = buildNode(d);
  nodesLayer.appendChild(el);
  nodeRegistry[d.id] = { el, data: d };
  if (animate) {
    const c = el.querySelector('circle');
    const finalR = d.r;
    c.setAttribute('r', '0');
    requestAnimationFrame(() => {
      c.style.transition = 'r .38s cubic-bezier(.34,1.56,.64,1)';
      c.setAttribute('r', finalR);
    });
  }
}

function mountEdge(x1, y1, x2, y2, color, dashed, key) {
  const el = buildEdge(x1, y1, x2, y2, color, dashed);
  edgesLayer.appendChild(el);
  edgeRegistry[key] = el;
}

function onNodeClick(d) {
  showPanel(d);
  if (!d.children || !d.children.length) return;
  if (expandedSet.has(d.id)) {
    collapseChildren(d);
  } else {
    expandChildren(d);
  }
}

function expandChildren(d) {
  expandedSet.add(d.id);
  d.children.forEach(c => {
    mountEdge(d.x, d.y, c.x, c.y, d.fill, c.dashed, 'e-' + c.id);
    mountNode(c, true);
  });
  flipDot(d, true);
}

function collapseChildren(d) {
  expandedSet.delete(d.id);
  d.children.forEach(c => {
    if (c.children && expandedSet.has(c.id)) collapseChildren(c);
    if (edgeRegistry['e-' + c.id]) { edgeRegistry['e-' + c.id].remove(); delete edgeRegistry['e-' + c.id]; }
    if (nodeRegistry[c.id]) { nodeRegistry[c.id].el.remove(); delete nodeRegistry[c.id]; }
  });
  flipDot(d, false);
}

function flipDot(d, open) {
  const nr = nodeRegistry[d.id];
  if (!nr) return;
  const plus = nr.el.querySelector('.expdot[text]') || nr.el.querySelector('text.expdot');
  if (plus) plus.textContent = open ? '−' : '+';
}

// Init L1
function initRender() {
  TREE.x = CX; TREE.y = CY;
  mountNode(TREE, false);
  TREE.children.forEach(c => {
    mountEdge(CX, CY, c.x, c.y, c.fill, c.dashed, 'l1-' + c.id);
    mountNode(c, false);
  });
}

// ═══════════════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════════════
function showPanel(d) {
  if (!d.detail) return;
  const det = d.detail;
  let html = `<span class="p-tag" style="color:${det.tagColor};background:${det.tagBg}">${det.tag}</span>
    <div class="p-title">${det.title}</div>
    <div class="p-sub">${det.sub}</div>`;
  det.sections.forEach(s => {
    html += `<div class="p-sec-label">${s.label}</div>`;
    s.items.forEach(item => { html += `<div class="p-item">${item}</div>`; });
  });
  document.getElementById('panel-body').innerHTML = html;
  document.getElementById('panel').classList.add('open');
}

function closePanel() { document.getElementById('panel').classList.remove('open'); }

// ═══════════════════════════════════════════════════════════════
// PAN & ZOOM
// ═══════════════════════════════════════════════════════════════
let scale = 1, tx = 0, ty = 0, dragging = false, lx = 0, ly = 0;
const vp = document.getElementById('viewport');

function applyT() { vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }

function doZoom(f, cx, cy) {
  cx = cx ?? window.innerWidth / 2; cy = cy ?? window.innerHeight / 2;
  const ns = Math.max(0.15, Math.min(4, scale * f));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; applyT();
}

function resetView() {
  scale = 0.52;
  tx = window.innerWidth / 2 - CX * scale;
  ty = window.innerHeight / 2 - CY * scale;
  applyT();
}

const cv = document.getElementById('canvas');
cv.addEventListener('mousedown', e => { if (e.target.closest('.bubble')) return; dragging = true; lx = e.clientX; ly = e.clientY; cv.classList.add('dragging'); });
window.addEventListener('mousemove', e => { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; applyT(); });
window.addEventListener('mouseup', () => { dragging = false; cv.classList.remove('dragging'); });
cv.addEventListener('wheel', e => { e.preventDefault(); doZoom(e.deltaY < 0 ? 1.09 : 0.91, e.clientX, e.clientY); }, { passive: false });

let t0 = 0;
cv.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
  if (e.touches.length === 2) t0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}, { passive: true });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) { tx += e.touches[0].clientX - lx; ty += e.touches[0].clientY - ly; lx = e.touches[0].clientX; ly = e.touches[0].clientY; applyT(); }
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    doZoom(d / t0, (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
    t0 = d;
  }
}, { passive: false });

initRender();
resetView();
</script>
